# Przykładowy workflow GitHub Actions dla WPCoderScan.
# Skopiuj ten plik do .github/workflows/ w swoim repozytorium wtyczki lub motywu.
#
# Akcja buduje skaner ze źródeł wskazanego tagu, więc nie wymaga pakietu npm.
# Przypnij konkretny tag albo SHA, żeby wynik skanu był powtarzalny.

name: Skan bezpieczeństwa WPCoderScan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write # wymagane do wysyłki SARIF do zakładki Security

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Przy znalezisku pewnym na poziomie high lub wyższym krok kończy się
      # błędem i oblewa check. SARIF trafia do zakładki Security także wtedy.
      - uses: wpcoder23/wpcoderscan@v0.3.2
        with:
          path: .
          fail-on: high
          strict: 'false'
