# Example GitHub Actions workflow for WPCoderScan.
# Copy this file to .github/workflows/ in your plugin or theme repository.
#
# The action builds the scanner from the source at the tag you pin, so it does
# not need the npm package. Pin a specific tag or SHA to keep scan results
# reproducible.

name: WPCoderScan security scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write # needed to upload SARIF to the Security tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A firm finding at the high level or above fails this step and the
      # check. SARIF is uploaded to the Security tab in that case too.
      - uses: wpcoder23/wpcoderscan@v0.8.0
        with:
          path: .
          fail-on: high
          strict: 'false'
          # lang: pl   # Polish messages (default: en)
          #
          # Adopting the scanner in an existing codebase. Save today's findings
          # with: npx wpcoderscan . --write-baseline .wpcoderscan-baseline.json
          # Commit the file. Then only new findings fail the build.
          # baseline: .wpcoderscan-baseline.json
          #
          # The scanner reads .wpcoderscan.json from the repository root on its own.
          # Set "config" only for a settings file in another place.
          # config: ci/wpcoderscan.json
