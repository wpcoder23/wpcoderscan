name: 'WPCoderScan'
description: 'Skaner bezpieczeństwa kodu WordPress i PHP. Skanuje kod przed wydaniem i wysyła wyniki do zakładki Security.'
author: 'WPCODER sp. z o.o.'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Ścieżka do skanowania (katalog wtyczki, motywu albo repozytorium).'
    required: false
    default: '.'
  fail-on:
    description: 'Poziom, od którego akcja kończy się błędem: critical, high, medium, low albo none.'
    required: false
    default: 'high'
  strict:
    description: 'Gdy true, do kodu wyjścia liczą się też znaleziska heurystyczne.'
    required: false
    default: 'false'
  upload-sarif:
    description: 'Gdy true, wyślij raport SARIF do zakładki Security (wymaga uprawnienia security-events: write).'
    required: false
    default: 'true'
  sarif-file:
    description: 'Ścieżka pliku SARIF z wynikiem.'
    required: false
    default: 'wpcoderscan.sarif'

runs:
  using: 'composite'
  steps:
    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Akcja buduje skaner ze źródeł z własnego repozytorium, w wersji wskazanej
    # tagiem albo SHA w "uses". Dzięki temu nie zależy od pakietu npm.
    - name: Zbuduj skaner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts && npm run build

    - name: Skan i raport SARIF
      shell: bash
      env:
        WPCS_PATH: ${{ inputs.path }}
        WPCS_FAIL_ON: ${{ inputs.fail-on }}
        WPCS_STRICT: ${{ inputs.strict }}
        WPCS_SARIF: ${{ inputs.sarif-file }}
      run: |
        STRICT=""
        if [ "$WPCS_STRICT" = "true" ]; then STRICT="--strict"; fi
        node "${{ github.action_path }}/dist/cli.js" "$WPCS_PATH" \
          --sarif $STRICT --fail-on "$WPCS_FAIL_ON" > "$WPCS_SARIF"

    - name: Wyślij SARIF do zakładki Security
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
