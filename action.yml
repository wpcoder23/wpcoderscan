name: 'WPCoderScan'
description: 'Security scanner for WordPress and PHP code. Scans code before release and sends the results to the Security tab.'
author: 'WPCODER sp. z o.o.'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Path to scan (a plugin directory, a theme or a repository).'
    required: false
    default: '.'
  fail-on:
    description: 'Level at which the action fails: critical, high, medium, low or none. Empty means the settings file, then high.'
    required: false
    default: ''
  strict:
    description: 'When true, heuristic findings count toward the exit code too.'
    required: false
    default: 'false'
  extended:
    description: 'When true, enable additional rules with lower precision (the --extended flag).'
    required: false
    default: 'false'
  lang:
    description: 'Language of messages: en or pl. Empty means the settings file, then en.'
    required: false
    default: ''
  baseline:
    description: 'Path of a baseline file (the --baseline flag). Findings saved in it are not reported. Empty means the settings file, then none.'
    required: false
    default: ''
  config:
    description: 'Path of a settings file (the --config flag). Empty means .wpcoderscan.json in the repository root, if the file exists.'
    required: false
    default: ''
  upload-sarif:
    description: 'When true, upload the SARIF report to the Security tab (needs the security-events: write permission).'
    required: false
    default: 'true'
  sarif-file:
    description: 'Path of the SARIF result file.'
    required: false
    default: 'wpcoderscan.sarif'

runs:
  using: 'composite'
  steps:
    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # The action builds the scanner from its own repository, at the version
    # pinned by the tag or SHA in "uses". It does not depend on the npm package.
    - name: Build the scanner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts && npm run build

    - name: Scan and write the SARIF report
      shell: bash
      env:
        WPCS_PATH: ${{ inputs.path }}
        WPCS_FAIL_ON: ${{ inputs.fail-on }}
        WPCS_STRICT: ${{ inputs.strict }}
        WPCS_EXTENDED: ${{ inputs.extended }}
        WPCS_LANG: ${{ inputs.lang }}
        WPCS_BASELINE: ${{ inputs.baseline }}
        WPCS_CONFIG: ${{ inputs.config }}
        WPCS_SARIF: ${{ inputs.sarif-file }}
      run: |
        # A flag is passed only when its input is set, so that the settings file
        # (.wpcoderscan.json in the repository root) can decide the rest.
        ARGS=(--sarif)
        if [ "$WPCS_STRICT" = "true" ]; then ARGS+=(--strict); fi
        if [ "$WPCS_EXTENDED" = "true" ]; then ARGS+=(--extended); fi
        if [ -n "$WPCS_LANG" ]; then ARGS+=(--lang "$WPCS_LANG"); fi
        if [ -n "$WPCS_FAIL_ON" ]; then ARGS+=(--fail-on "$WPCS_FAIL_ON"); fi
        if [ -n "$WPCS_BASELINE" ]; then ARGS+=(--baseline "$WPCS_BASELINE"); fi
        if [ -n "$WPCS_CONFIG" ]; then ARGS+=(--config "$WPCS_CONFIG"); fi
        node "${{ github.action_path }}/dist/cli.js" "$WPCS_PATH" "${ARGS[@]}" > "$WPCS_SARIF"

    - name: Upload SARIF to the Security tab
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
