name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Test e2e CLI: podatne próbki łamią build, bezpieczne przechodzą, --extended działa.
      - name: Smoke CLI
        run: |
          code=0
          node dist/cli.js test/fixtures/vulnerable --json > /dev/null || code=$?
          test "$code" = "1"
          node dist/cli.js test/fixtures/safe --fail-on high
          code=0
          node dist/cli.js test/fixtures/vulnerable --extended --json > /dev/null || code=$?
          test "$code" = "1"

  # Sprawdza, że akcja z action.yml buduje skaner i przechodzi na bezpiecznych próbkach.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: test/fixtures/safe
          fail-on: high
          upload-sarif: 'false'
