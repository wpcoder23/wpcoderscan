name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # End-to-end CLI test: vulnerable samples fail the build, safe ones pass, --extended and --lang work.
      - name: Smoke CLI
        run: |
          code=0
          node dist/cli.js test/fixtures/vulnerable --json > /dev/null || code=$?
          test "$code" = "1"
          node dist/cli.js test/fixtures/safe --fail-on high
          code=0
          node dist/cli.js test/fixtures/vulnerable --extended --json > /dev/null || code=$?
          test "$code" = "1"
          # Language: English by default, Polish on request.
          out=$(node dist/cli.js --help)
          echo "$out" | grep -q "Usage:"
          out=$(node dist/cli.js --help --lang pl)
          echo "$out" | grep -q "Użycie:"
          out=$(WPCODERSCAN_LANG=pl node dist/cli.js --help)
          echo "$out" | grep -q "Użycie:"
          code=0
          node dist/cli.js test/fixtures/safe --lang xx > /dev/null 2>&1 || code=$?
          test "$code" = "2"

  # Checks that the action from action.yml builds the scanner and passes on the safe samples.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: test/fixtures/safe
          fail-on: high
          upload-sarif: 'false'
